<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" fill="none" aria-hidden="true" role="img">
  <title>Abstrakt kortkontur</title>
  <!-- Ramme -->
  <rect x="5" y="5" width="90" height="130" rx="10" fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.35" style="color: var(--primary)"/>
  <!-- Hodefelt -->
  <rect x="12" y="12" width="76" height="22" rx="5" fill="currentColor" opacity="0.15" style="color: var(--accent)"/>
  <!-- Kunstfelt -->
  <rect x="12" y="40" width="76" height="58" rx="5" fill="currentColor" opacity="0.08" style="color: var(--primary)"/>
  <!-- Tekstfelt -->
  <rect x="12" y="105" width="76" height="12" rx="4" fill="currentColor" opacity="0.1" style="color: var(--highlight)"/>
  <rect x="12" y="121" width="50" height="8" rx="4" fill="currentColor" opacity="0.08" style="color: var(--text)"/>
  <!-- Sjeldenhetsstjerne nede til høyre -->
  <circle cx="82" cy="125" r="5" fill="currentColor" opacity="0.25" style="color: var(--accent)"/>
</svg>
